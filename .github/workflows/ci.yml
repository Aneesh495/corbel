name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dart dependencies
        run: dart pub get

      - name: Verify static analysis
        run: dart analyze --fatal-infos

      - name: Verify zero em-dash punctuation across repository
        run: python3 tool/audit_em_dashes.py

      - name: Run Dart test suite
        run: dart test

      - name: Build C SIMD vector acceleration library
        run: |
          cmake -B build native
          cmake --build build

      - name: Run Python SDK test suite
        run: |
          cd clients/python
          python -m unittest discover -s tests
